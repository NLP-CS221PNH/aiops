name: reproducibility-heavy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  heavy:
    runs-on: [self-hosted, private, reproducibility]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318eca7822d2e43c183d8ef4fa8 # v5.3.0
        with:
          python-version: "3.11"
      - name: Refuse hosted cache and artifact upload
        run: |
          python - <<'PY'
          print("heavy job must keep raw/full-text/private bytes in the ephemeral workspace only")
          PY
      - name: Detect pinned raw inputs
        id: pinned
        run: |
          if [ -d 02_datasets/acquired/raw ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "unsupported_until_pinned_inputs"
          fi
      - name: Heavy research-pack validation
        if: steps.pinned.outputs.present == 'true'
        run: python scripts/validate-research-pack.py --check --mode heavy
      - name: Public artifact inventory
        if: steps.pinned.outputs.present == 'true'
        run: python scripts/validate-public-artifacts.py --ledger 04_audit/public-artifact-ledger.tsv
