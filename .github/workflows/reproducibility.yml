name: reproducibility-heavy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Research pack inputs are unsupported on this checkout
        run: |
          if [ -z "${CS221_RESEARCH_PACK_ROOT:-}" ]; then
            echo "unsupported_until_pinned_inputs"
            exit 0
          fi
          echo "research pack root is set; heavy reconstruction stays local"
          exit 0
