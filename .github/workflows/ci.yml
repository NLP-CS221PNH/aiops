name: pr-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318eca7822d2e43c183d8ef4fa8 # v5.3.0
        with:
          python-version: "3.11"
      - name: Install PR test dependencies
        run: python -m pip install pytest pyyaml numpy pydantic tokenizers==0.21.4
      - name: Public source tree
        run: python scripts/validate-public-source-tree.py
      - name: PR pytest
        run: python -m pytest -q -o pythonpath=. tests/test_public_source_tree.py tests/test_training_isolation.py tests/test_generation_contract.py tests/test_generation_reliability.py tests/test_coverage.py tests/test_automated_review.py tests/test_local_judging.py
